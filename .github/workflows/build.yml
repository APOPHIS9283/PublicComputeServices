name: Build Xposed Module APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK with Sekret Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate Sekret Module
        run: ./gradlew generateSekret
        continue-on-error: true # Allows it to proceed or fallback if keys are missing

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-services-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 30
