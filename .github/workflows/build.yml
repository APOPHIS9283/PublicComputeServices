name: Simple Python Build

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Package and Upload Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Package Archive
        run: |
          mkdir -p dist
          # Bundle everything into a clean tarball, excluding git and build junk
          tar -czvf dist/PublicComputeServices.tar.gz --exclude='.git' --exclude='dist' .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-services-build
          path: dist/
          retention-days: 30
