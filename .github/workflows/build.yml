name: Build APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          echo "deb http://security.ubuntu.com/ubuntu focal-security main universe" | sudo tee /etc/apt/sources.list.d/focal.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            libncurses5:i386 \
            libstdc++6:i386 \
            libz1:i386 \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36
          pip install --upgrade buildozer

      - name: Initialize Buildozer Spec (if missing)
        run: |
          if [ ! -f "buildozer.spec" ]; then
            buildozer init
          fi

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Automatically accept SDK licenses by piping yes into sdkmanager if available, or pre-accepting via buildozer config
          yes | buildozer android pgsdk || true

      - name: Build APK
        run: |
          # Use yes to accept any lingering interactive prompts during build tool installation
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-release-apk
          path: bin/*.apk
