name: Build Android Xposed Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create missing sekret module directory
        run: |
          mkdir -p app/sekret
          if [ ! -f "app/sekret/build.gradle.kts" ] && [ ! -f "app/sekret/build.gradle" ]; then
            echo 'plugins { id("com.android.library") }' > app/sekret/build.gradle.kts
          fi
        shell: bash

      - name: Patch empty file path bindings in build files
        run: |
          # Finds and replaces empty file() arguments like file("") or file('') with null or comments them out safely
          find . -name "*.kts" -o -name "*.gradle" | xargs sed -i 's/file(\s*""\s*)/null/g'
          find . -name "*.kts" -o -name "*.gradle" | xargs sed -i "s/file(\s*''\s*)/null/g"
        shell: bash

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-services-debug
          path: app/build/outputs/apk/debug/*.apk
