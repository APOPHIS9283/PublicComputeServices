name: Build Android Xposed Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create valid sekret module configuration
        run: |
          mkdir -p app/sekret
          cat << 'EOF' > app/sekret/build.gradle.kts
          plugins {
              id("com.android.library")
          }
          android {
              compileSdk = 36
              defaultConfig {
                  minSdk = 34
              }
          }
          EOF
        shell: bash

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-services-debug
          path: app/build/outputs/apk/debug/*.apk
