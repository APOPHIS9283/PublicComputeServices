name: Build Xposed Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Secrets / Properties (if required)
        # If your build pipeline relies on secrets like MANIFEST_KEY, 
        # you can write them into properties files dynamically like this:
        run: |
          if [ -n "${{ secrets.MANIFEST_KEY }}" ]; then
            echo "MANIFEST_KEY=${{ secrets.MANIFEST_KEY }}" >> app/sekret.properties
          fi
        shell: bash

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-compute-services-debug
          path: app/build/outputs/apk/debug/*.apk
