name: Build and Upload PublicComputeServices

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package Python Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Package / Artifacts
        run: |
          mkdir -p dist/
          # Bundle the core source files into a tarball artifact directory safely
          tar -czvf dist/public-compute-services-build.tar.gz --exclude='.git' --exclude='dist' .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-build-artifact
          path: dist/
          retention-days: 30
